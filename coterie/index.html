<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coterie HR Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one glass "app window" floating on a warm honey gradient; bento grid of soft cards inside.
   Pages: Overview (bento), People (table), Payroll (3-column: team / month / profile). */
:root{
  --ground:#ECE7DA;           /* page behind the window */
  --glow:#F4D77A;             /* honey glow in the corner */
  --frame:rgba(248,246,239,.72);
  --frame-line:rgba(255,255,255,.75);
  --card:#F8F6EF;
  --card-2:#EFECE3;
  --ink:#1D1C1A;
  --ink-2:#6E6A61;
  --ink-3:#A9A497;
  --line:rgba(29,28,26,.08);
  --solid:#1F1E1C;            /* black pills / active nav */
  --on-solid:#F6F4EE;
  --panel:#232220;            /* dark onboarding card (dark in both themes) */
  --panel-2:#2F2E2B;
  --on-panel:#F3F1EA;
  --on-panel-2:#8E8A80;
  --yellow:#F2C23D;
  --yellow-ink:#3A2E0A;
  --yellow-soft:#F7E7B0;
  --hatch:rgba(29,28,26,.16);
  --green:#3D8B57; --green-bg:#E2EEDD;
  --amber:#B86E25; --amber-bg:#F6E5D0;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 12px 32px -14px rgba(74,58,20,.22), 0 2px 6px -2px rgba(74,58,20,.06);
  --shadow-lg:0 40px 80px -30px rgba(74,58,20,.35);
  --display:'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-card:24px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#100F0D; --glow:#6B5414;
    --frame:rgba(28,27,25,.78); --frame-line:rgba(255,255,255,.06);
    --card:#1E1D1B; --card-2:#292825;
    --ink:#F2F0E9; --ink-2:#A7A296; --ink-3:#6E6A61; --line:rgba(255,255,255,.08);
    --solid:#F2F0E9; --on-solid:#1A1917;
    --panel:#0F0E0D; --panel-2:#22211F; --on-panel:#F3F1EA; --on-panel-2:#7F7B72;
    --yellow:#F2C23D; --yellow-ink:#2A2006; --yellow-soft:#4A3D16;
    --hatch:rgba(255,255,255,.14);
    --green:#7CC793; --green-bg:#1F3326; --amber:#E7A869; --amber-bg:#3A2A18;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px -14px rgba(0,0,0,.6);
    --shadow-lg:0 40px 80px -30px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#100F0D; --glow:#6B5414;
  --frame:rgba(28,27,25,.78); --frame-line:rgba(255,255,255,.06);
  --card:#1E1D1B; --card-2:#292825;
  --ink:#F2F0E9; --ink-2:#A7A296; --ink-3:#6E6A61; --line:rgba(255,255,255,.08);
  --solid:#F2F0E9; --on-solid:#1A1917;
  --panel:#0F0E0D; --panel-2:#22211F; --on-panel:#F3F1EA; --on-panel-2:#7F7B72;
  --yellow:#F2C23D; --yellow-ink:#2A2006; --yellow-soft:#4A3D16;
  --hatch:rgba(255,255,255,.14);
  --green:#7CC793; --green-bg:#1F3326; --amber:#E7A869; --amber-bg:#3A2A18;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px -14px rgba(0,0,0,.6);
  --shadow-lg:0 40px 80px -30px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; font-family:var(--body); font-size:13px; color:var(--ink);
  background:
    radial-gradient(60% 55% at 92% 95%, var(--glow) 0%, transparent 70%),
    radial-gradient(45% 40% at 70% 0%, color-mix(in srgb, var(--glow) 45%, transparent) 0%, transparent 70%),
    var(--ground);
  background-attachment:fixed;
  padding-inline:16px; padding-block:28px 40px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:10px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- App window ---------- */
.app{
  max-width:1320px; margin:0 auto; border-radius:30px;
  background:var(--frame); border:1px solid var(--frame-line);
  -webkit-backdrop-filter:blur(30px) saturate(1.2); backdrop-filter:blur(30px) saturate(1.2);
  box-shadow:var(--shadow-lg);
  padding:22px 24px 24px; position:relative;
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:30}
.logo{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-family:var(--display);font-size:17px;font-weight:400;letter-spacing:-.01em}
.logo i{width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 50%,var(--yellow) 50%);display:block}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.seg button{position:relative;z-index:1;height:30px;padding:0 15px;border-radius:999px;font-size:12px;font-weight:500;color:var(--ink-2);transition:color .35s var(--ease)}
.seg button[aria-selected="true"]{color:var(--on-solid)}
.seg .ind{position:absolute;top:4px;left:4px;height:30px;border-radius:999px;background:var(--solid);transition:transform .5s var(--ease), width .5s var(--ease)}
.chip-btn{height:38px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;transition:transform .2s var(--ease)}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;transition:transform .2s var(--ease)}
.chip-btn:hover,.icon-btn:hover{transform:translateY(-1px)}
.chip-btn:active,.icon-btn:active{transform:scale(.96)}
.badge{position:absolute;top:3px;right:4px;min-width:13px;height:13px;border-radius:7px;background:var(--yellow);color:var(--yellow-ink);font-size:8px;font-weight:600;display:grid;place-items:center;padding:0 3px;transition:transform .3s var(--ease),opacity .3s}
.badge.gone{transform:scale(0);opacity:0}
.gear{transition:transform .6s var(--ease)}
.chip-btn:hover .gear{transform:rotate(90deg)}

/* Popovers */
.pop{position:absolute;top:48px;right:0;width:300px;border-radius:20px;background:var(--panel);color:var(--on-panel);padding:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);transform-origin:top right;transform:scale(.94) translateY(-6px);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .25s}
.pop.open{transform:none;opacity:1;pointer-events:auto}
.pop h4{margin:0 0 10px;font:500 14px var(--display);display:flex;justify-content:space-between;align-items:center}
.pop h4 button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--on-panel-2)}
.pop h4 button:hover{background:var(--panel-2);color:var(--on-panel)}
.notif{display:flex;gap:11px;align-items:center;padding:10px 6px;border-radius:12px;border-top:1px solid rgba(255,255,255,.07);transition:background .2s}
.notif:first-of-type{border-top:0}
.notif:hover{background:var(--panel-2)}
.notif b{display:block;font-weight:500;font-size:12px}
.notif span{display:block;font-size:11.5px;color:#CFCBC1}
.notif small{display:block;font-size:10.5px;color:var(--on-panel-2);margin-top:2px}
.pop .row{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;font-size:12px;border-top:1px solid rgba(255,255,255,.07)}
.pop .row:first-of-type{border-top:0}
.mini-seg{display:flex;background:var(--panel-2);border-radius:999px;padding:3px}
.mini-seg button{padding:5px 10px;border-radius:999px;font-size:11px;color:var(--on-panel-2)}
.mini-seg button.on{background:var(--yellow);color:var(--yellow-ink)}
.switch{width:34px;height:20px;border-radius:999px;background:var(--panel-2);position:relative;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--on-panel);transition:transform .3s var(--ease)}
.switch.on{background:var(--yellow)}
.switch.on::after{transform:translateX(14px);background:var(--panel)}

/* ---------- Page transitions ---------- */
#view{position:relative}
#view.leaving > *{transition:opacity .22s, filter .22s, transform .22s;opacity:0;filter:blur(6px);transform:translateY(-4px)}
.rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.title{font-family:var(--display);font-weight:300;font-size:clamp(30px,3.6vw,46px);letter-spacing:-.025em;line-height:1.05;margin:14px 0 18px;text-wrap:balance}
.title .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em}
.title .c{display:inline-block;animation:charUp .8s var(--ease) both;animation-delay:calc(var(--c) * 22ms)}
@keyframes charUp{from{transform:translateY(105%);opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}

/* ---------- Overview: stats row ---------- */
.stats{display:flex;align-items:flex-end;gap:28px;margin-bottom:16px}
.bars{flex:1;display:flex;gap:8px;min-width:0}
.bar-col{display:flex;flex-direction:column;gap:7px;min-width:64px}
.bar-col label{font-size:11px;color:var(--ink-2);white-space:nowrap}
.pbar{height:30px;border-radius:999px;display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:500;transform-origin:left;animation:grow 1.1s var(--ease) both;animation-delay:calc(var(--i,0)*90ms + 200ms)}
@keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
.pbar.dark{background:var(--solid);color:var(--on-solid)}
.pbar.yel{background:var(--yellow);color:var(--yellow-ink)}
.pbar.hatch{background:repeating-linear-gradient(-55deg,var(--hatch) 0 1.5px,transparent 1.5px 7px);border:1px solid var(--line);color:var(--ink)}
.pbar.hatch span{background:var(--card);padding:3px 7px;border-radius:999px;margin-left:-6px}
.pbar.outline{border:1.5px solid var(--ink-3);color:var(--ink)}
.kpis{display:flex;gap:26px}
.kpi{display:flex;flex-direction:column;align-items:flex-start}
.kpi .num{font-size:clamp(34px,3.4vw,46px);font-weight:300;letter-spacing:-.03em;line-height:1}
.kpi small{display:flex;align-items:center;gap:5px;color:var(--ink-2);font-size:11px;margin-top:6px;padding-left:3px}

/* ---------- Overview: bento ---------- */
.bento{display:grid;grid-template-columns:1fr 1.06fr 1.06fr .98fr;grid-template-rows:268px 250px;gap:12px}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px;position:relative;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center}
.card-h h3{margin:0;font:400 16px var(--display);letter-spacing:-.01em}
.arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);transition:transform .35s var(--ease),background .25s}
.arrow:hover{transform:rotate(45deg);background:var(--yellow);color:var(--yellow-ink)}

/* Profile */
.profile{grid-area:1/1;padding:0;overflow:hidden;isolation:isolate}
.profile .ph{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.profile:hover .ph{transform:scale(1.04)}
.profile .ph svg{width:100%;height:100%}
.profile::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(30,20,10,.62));z-index:1}
.profile .who{position:absolute;left:16px;bottom:16px;z-index:2;color:#FBF8F1}
.profile .who b{display:block;font:400 18px var(--display);letter-spacing:-.01em}
.profile .who span{font-size:11.5px;opacity:.75}
.profile .sal{position:absolute;right:14px;bottom:16px;z-index:2;height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#FBF8F1;display:grid;place-items:center;font-size:13px;transition:background .25s}
.profile .sal:hover{background:rgba(255,255,255,.28)}

/* Progress */
.progress{grid-area:1/2;display:flex;flex-direction:column}
.avg{display:flex;align-items:center;gap:14px;margin-top:6px}
.avg .num{font-size:28px;font-weight:300;letter-spacing:-.02em}
.avg small{color:var(--ink-2);font-size:11px;line-height:1.3}
.week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);align-items:end;padding:8px 4px 0;gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer;position:relative}
.day .track{position:relative;width:8px;height:96px;display:flex;align-items:flex-end;justify-content:center}
.day .track::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1.5px dotted var(--ink-3);opacity:.6}
.day .fill{position:relative;width:7px;border-radius:6px;background:var(--solid);transform-origin:bottom;animation:barUp 1s var(--ease) both;animation-delay:calc(var(--i)*60ms + 300ms);transition:background .25s,opacity .25s,width .25s}
@keyframes barUp{from{transform:scaleY(0)}to{transform:none}}
.day.weekend .fill{background:var(--ink-3)}
.day.today .fill{background:var(--yellow)}
.day .dot{width:4px;height:4px;border-radius:50%;background:var(--ink)}
.day.weekend .dot{background:var(--ink-3)}
.day.today .dot{background:var(--yellow)}
.day label{font-size:10.5px;color:var(--ink-2);cursor:pointer}
.day.today label{color:var(--ink);font-weight:600}
.week:hover .day .fill{opacity:.35}
.week:hover .day:hover .fill{opacity:1;width:9px}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translate(-50%,4px);white-space:nowrap;background:var(--yellow);color:var(--yellow-ink);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.day.show .tip{opacity:1;transform:translate(-50%,0)}
.week:hover .day.show:not(:hover) .tip{opacity:0}
.day:not(.today) .tip{background:var(--solid);color:var(--on-solid)}

/* Timer */
.timer{grid-area:1/3;display:flex;flex-direction:column}
.dial{flex:1;display:grid;place-items:center;position:relative;min-height:0}
.dial svg{width:184px;height:184px;max-width:100%}
.dial .read{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;pointer-events:none}
.dial .read .num{font-size:30px;font-weight:300;letter-spacing:-.01em;line-height:1}
.dial .read small{font-size:10.5px;color:var(--ink-2);margin-top:5px;font-weight:500}
.dial .read small b{font-weight:600;color:var(--ink-2);transition:color .3s}
.dial .read small b.on{color:var(--green)}
.dial .read sup{font-size:9px}
.tick{stroke:var(--ink-3);stroke-width:1.4;stroke-linecap:round;opacity:.55;transition:stroke .3s,opacity .3s}
.tick.on{stroke:var(--ink);opacity:1}
.timer-ctl{display:flex;justify-content:space-between;align-items:center}
.timer-ctl .l{display:flex;gap:6px}
.round{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.round:hover{transform:translateY(-1px)}
.round:active{transform:scale(.92)}
.round.solid{width:38px;height:38px;background:var(--solid);color:var(--on-solid)}
.round.solid.on{background:var(--yellow);color:var(--yellow-ink)}
#arc{transition:stroke-dashoffset .9s var(--ease)}
#knob{transition:transform .5s var(--ease)}
.spin{animation:spin .5s var(--ease)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(-360deg)}}

/* Onboarding */
.onb{grid-area:1/4/3/5;display:flex;flex-direction:column;padding-bottom:12px}
.onb .pct{font:300 34px var(--display);letter-spacing:-.02em;line-height:1}
.groups{display:flex;gap:6px;margin:12px 0 0}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp small{font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.gbar{height:34px;border-radius:10px;background:var(--card-2);position:relative;overflow:hidden}
.gbar i{position:absolute;inset:0 auto 0 0;border-radius:10px 0 0 10px;transition:width .8s var(--ease)}
.gbar span{position:relative;z-index:1;font-size:11px;font-weight:500;padding:0 9px;line-height:34px;white-space:nowrap}
.grp.g0 i{background:var(--yellow)} .grp.g0 span{color:var(--yellow-ink)}
.grp.g1 i{background:var(--solid)} .grp.g1 .gbar.has span{mix-blend-mode:difference;color:#fff}
.grp.g2 i{background:var(--ink-3)}
.stack{position:relative;flex:1;margin-top:16px;display:flex;flex-direction:column;min-height:0}
.stack::before,.stack::after{content:"";position:absolute;left:14px;right:14px;top:-10px;height:20px;border-radius:14px;background:var(--ink-3);opacity:.55}
.stack::after{left:7px;right:7px;top:-5px;background:var(--ink-2);opacity:.6}
.tasks{position:relative;z-index:1;flex:1;background:var(--panel);color:var(--on-panel);border-radius:20px;padding:14px 10px 8px;display:flex;flex-direction:column;min-height:0}
.tasks header{display:flex;justify-content:space-between;align-items:center;padding:0 6px 6px}
.tasks header b{font:400 14px var(--display)}
.tasks header .num{font-size:24px;font-weight:300}
.tlist{list-style:none;margin:0;padding:0;overflow:auto;scrollbar-width:none;flex:1}
.tlist::-webkit-scrollbar{display:none}
.task{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:12px;cursor:pointer;transition:background .2s}
.task:hover{background:var(--panel-2)}
.task .ic{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:#F3F1EA;color:#1F1E1C;transition:background .3s,color .3s}
.task.done .ic{background:var(--panel-2);color:var(--on-panel-2)}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-weight:500;font-size:12px;position:relative;width:max-content;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.task .tx b::after{content:"";position:absolute;left:0;top:52%;height:1.3px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.task.done .tx b{color:var(--on-panel-2)}
.task.done .tx b::after{transform:scaleX(1)}
.task .tx small{font-size:10.5px;color:var(--on-panel-2)}
.task .ck{width:20px;height:20px;flex:none;border-radius:50%;background:#3A3936;display:grid;place-items:center;color:transparent;transition:background .3s,transform .3s var(--ease)}
.task.done .ck{background:var(--yellow);color:var(--yellow-ink);animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}

/* Accordion */
.acc{grid-area:2/1;padding:8px 18px}
.acc-i{border-bottom:1px solid var(--line)}
.acc-i:last-child{border-bottom:0}
.acc-h{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:12.5px;font-weight:500;text-align:left}
.acc-h svg{transition:transform .45s var(--ease);color:var(--ink-2)}
.acc-i.open .acc-h svg{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.acc-i.open .acc-b{grid-template-rows:1fr}
.acc-b > div{overflow:hidden;min-height:0}
.acc-b .in{padding:0 0 12px;opacity:0;transform:translateY(-4px);transition:opacity .35s,transform .45s var(--ease)}
.acc-i.open .acc-b .in{opacity:1;transform:none;transition-delay:.12s}
.kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);padding:3px 0}
.kv b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.device{display:flex;align-items:center;gap:10px}
.device .thumb{width:42px;height:32px;border-radius:9px;background:var(--card-2);display:grid;place-items:center;color:var(--ink-2)}
.device b{display:block;font-size:11.5px;font-weight:500}
.device small{font-size:10.5px;color:var(--ink-2)}
.device .more{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.device .more:hover{background:var(--card-2)}

/* Week calendar */
.cal{grid-area:2/2/3/4;display:flex;flex-direction:column;padding:14px 16px 0;overflow:hidden}
.cal-h{display:flex;justify-content:space-between;align-items:center}
.cal-h h3{margin:0;font:400 15px var(--display)}
.navpill{height:28px;padding:0 11px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:transform .2s var(--ease)}
.navpill:hover{transform:translateY(-1px)}
.cal-days,.cal-body{display:grid;grid-template-columns:52px repeat(6,1fr)}
.cal-days{margin-top:8px}
.cal-days div{text-align:center;font-size:10.5px;color:var(--ink-2);line-height:1.2}
.cal-days div b{display:grid;place-items:center;margin:2px auto 0;width:22px;height:22px;font:300 14px var(--display);color:var(--ink-2)}
.cal-days div.today{color:var(--ink);font-weight:600}
.cal-days div.today b{background:var(--solid);color:var(--on-solid);border-radius:50%;font-weight:400;font-size:12px}
.cal-body{position:relative;flex:1;margin-top:6px;min-height:150px}
.cal-body .hr{grid-column:1/-1;height:40px;border-top:1px solid var(--line);position:relative}
.cal-body .hr span{position:absolute;top:-7px;left:0;font-size:10px;color:var(--ink-2);background:var(--card);padding-right:6px}
.cal-body .hr:first-child{border-top:0}
.vl{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.ev{position:absolute;border-radius:12px;padding:6px 9px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 20px -10px rgba(30,20,0,.35);cursor:grab;transition:transform .25s var(--ease),box-shadow .25s;animation:evIn .55s var(--ease) both;animation-delay:calc(var(--i)*80ms + 120ms);user-select:none;touch-action:none;z-index:2}
.ev:hover{transform:translateY(-2px);box-shadow:0 16px 26px -12px rgba(30,20,0,.4)}
.ev.drag{cursor:grabbing;transition:none;z-index:5;box-shadow:0 22px 34px -12px rgba(30,20,0,.45)}
@keyframes evIn{from{opacity:0;transform:translateY(8px) scale(.97)}}
.ev .t{flex:1;min-width:0}
.ev b{display:block;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;font-size:10px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.dark{background:var(--panel);color:var(--on-panel)}
.ev.yel{background:var(--yellow-soft);color:var(--ink);box-shadow:none;border:1px solid color-mix(in srgb,var(--yellow) 60%,transparent)}
.ev.light{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.faces{display:flex}
.faces > *{width:20px;height:20px;border-radius:50%;margin-left:-6px;box-shadow:0 0 0 1.5px var(--panel)}
.ev.light .faces > *,.ev.yel .faces > *{box-shadow:0 0 0 1.5px var(--card)}
.now{position:absolute;height:1.5px;background:var(--yellow);right:0;z-index:1;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.wk-anim{animation:wk .45s var(--ease) both}
@keyframes wk{from{opacity:0;transform:translateX(var(--dx,12px))}}

/* ---------- People ---------- */
.ph-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ph-row .title{margin-bottom:12px}
.ph-tools{display:flex;gap:8px;flex-wrap:wrap}
.search{height:38px;width:250px;max-width:100%;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;border:1.5px solid transparent;transition:border-color .25s,width .4s var(--ease)}
.search:focus-within{border-color:var(--ink);width:270px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:12px}
.search input::placeholder{color:var(--ink-3)}
.search .clr{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#3B6FD8;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s var(--ease)}
.search.has .clr{opacity:1;transform:none}
.cta{height:38px;padding:0 16px;border-radius:999px;background:var(--solid);color:var(--on-solid);display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;transition:transform .2s var(--ease)}
.cta:hover{transform:translateY(-1px)}
.cta:active{transform:scale(.96)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{height:28px;padding:0 11px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:11.5px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center;transition:background .3s,color .3s}
.filters button sup{font-size:9px;opacity:.6;top:0}
.filters button.on{background:var(--solid);color:var(--on-solid)}
.tbl-wrap{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:10px 16px 12px;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
th{font-size:10.5px;font-weight:500;color:var(--ink-2);text-align:left;padding:12px 10px;cursor:pointer;user-select:none;white-space:nowrap}
th .srt{display:inline-block;opacity:0;margin-left:3px;transition:opacity .2s,transform .3s}
th:hover .srt,th.sorted .srt{opacity:.8}
th.desc .srt{transform:rotate(180deg)}
td{padding:0 10px;height:44px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line);transition:background .25s,color .25s;white-space:nowrap}
tr.row{cursor:pointer;animation:rowIn .5s var(--ease) both;animation-delay:calc(var(--i)*40ms + 120ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}
tr.row:hover td{background:var(--card-2)}
tr.row.sel td{background:var(--yellow);color:var(--yellow-ink);border-top-color:transparent}
tr.row.sel + tr td{border-top-color:transparent}
tr.row td:first-child{border-radius:14px 0 0 14px;width:36px}
tr.row td:last-child{border-radius:0 14px 14px 0}
.nm{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:500}
tr.sel .nm{color:var(--yellow-ink)}
.nm svg{width:26px;height:26px;border-radius:50%;flex:none}
.cb{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent;transition:all .25s}
tr.sel .cb{background:var(--solid);border-color:var(--solid);color:var(--on-solid)}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:10.5px;font-weight:500}
.st::before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
.st.Active{background:var(--green-bg);color:var(--green)}
.st.New{background:var(--solid);color:var(--on-solid)}
.st.Away{background:var(--amber-bg);color:var(--amber)}
.empty{text-align:center;color:var(--ink-2);padding:30px 0;font-size:12px}

/* ---------- Payroll ---------- */
.pay{display:grid;grid-template-columns:240px minmax(0,1fr) 290px;gap:12px;margin-top:16px;min-height:640px}
.team h3,.side h3{margin:0 0 10px;font:400 16px var(--display)}
.team ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tm{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;cursor:pointer;width:100%;text-align:left;transition:background .3s,color .3s}
.tm:hover{background:var(--card-2)}
.tm.on{background:var(--solid);color:var(--on-solid)}
.tm svg{width:30px;height:30px;border-radius:50%;flex:none}
.tm b{display:block;font-size:12px;font-weight:500}
.tm small{font-size:10.5px;color:var(--ink-2)}
.tm.on small{color:color-mix(in srgb,var(--on-solid) 60%,transparent)}
.month .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.month .big{font:300 30px var(--display);letter-spacing:-.02em}
.month .big small{font-size:12px;color:var(--ink-2);margin:0 2px}
.pill-sm{height:26px;padding:0 10px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:10.5px;font-weight:500;display:inline-flex;align-items:center}
.wh{display:flex;gap:8px;margin:12px 0 16px;align-items:flex-end}
.wh .grp{flex-grow:var(--g);min-width:56px}
.wh .pbar{height:28px;transition:all .6s var(--ease);animation:none}
.wh .pbar.gray{background:var(--ink-3);color:var(--ink);opacity:.8;justify-content:center}
.wh .pbar.dark{justify-content:center}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.mcal .dw{text-align:center;font-size:10.5px;color:var(--ink-2);padding-bottom:4px}
.dc{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--ink-2);cursor:pointer;animation:cellIn .45s var(--ease) both;animation-delay:calc(var(--i)*18ms);transition:border-color .2s,transform .2s var(--ease),box-shadow .2s}
.dc:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.dc.today{border:1.5px solid var(--ink)}
.dc.pick{border:1.5px solid var(--yellow);box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 30%,transparent)}
.dc.blank{visibility:hidden}
@keyframes cellIn{from{opacity:0;transform:translateY(6px)}}
.hc{align-self:flex-start;height:17px;padding:0 7px;border-radius:999px;font-size:9.5px;font-weight:600;display:inline-flex;align-items:center;background:var(--yellow);color:var(--yellow-ink)}
.hc.ot{background:var(--solid);color:var(--on-solid)}
.hc.lv{background:var(--card-2);color:var(--ink-2);font-weight:500}
.side{display:flex;flex-direction:column}
.side .av{width:84px;height:84px;margin:4px auto 10px;border-radius:50%;overflow:hidden;box-shadow:0 10px 24px -10px rgba(60,40,0,.35)}
.side .av svg{width:100%;height:100%}
.side .nm2{text-align:center;font:400 18px var(--display)}
.side .rl{text-align:center;font-size:11px;color:var(--ink-2);padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.dl{display:grid;grid-template-columns:16px 72px 1fr;gap:8px 8px;align-items:center;font-size:11.5px}
.dl svg{color:var(--ink-2)}
.dl span{color:var(--ink-2)}
.dl b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side h5{margin:16px 0 8px;font-size:12px;font-weight:600}
.docs{display:flex;gap:6px}
.doc{flex:1;min-width:0;height:34px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;padding:0 9px;font-size:11px;font-weight:500;transition:transform .2s var(--ease)}
.doc:hover{transform:translateY(-1px)}
.doc span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.doc svg:last-child{color:var(--ink-2)}
.meter{margin-top:10px}
.meter div{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-bottom:5px}
.meter div b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meter .tr{height:6px;border-radius:6px;background:var(--card-2);overflow:hidden}
.meter .tr i{display:block;height:100%;border-radius:6px;background:var(--solid);transition:width .9s var(--ease)}
.meter.y .tr i{background:var(--yellow)}
.swap{animation:swap .5s var(--ease) both}
@keyframes swap{from{opacity:0;filter:blur(6px);transform:translateY(6px)}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--panel);color:var(--on-panel);padding:10px 16px;border-radius:999px;font-size:12px;font-weight:500;box-shadow:0 20px 40px -14px rgba(0,0,0,.45);transition:transform .45s var(--ease),opacity .3s;z-index:100;display:flex;gap:8px;align-items:center;pointer-events:none;max-width:calc(100% - 32px)}
.toast i{width:7px;height:7px;border-radius:50%;background:var(--yellow);flex:none}
.toast.show{transform:translate(-50%,0);opacity:1}


/* ---------- Motion layer ---------- */
:root{--spot:rgba(242,194,61,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--spot:rgba(242,194,61,.09)}}
:root[data-theme="dark"]{--spot:rgba(242,194,61,.09)}
.card,.tbl-wrap{background:radial-gradient(380px circle at var(--mx,-500px) var(--my,-500px),var(--spot),transparent 60%),var(--card);transition:transform .6s var(--ease),box-shadow .4s}
.card.tilt{transition:transform .12s linear,box-shadow .4s;box-shadow:var(--shadow),0 30px 50px -30px rgba(74,58,20,.35)}
.profile{background:#C79C74}
.profile .ph svg{transform:translate(var(--px,0),var(--py,0)) scale(1.06);transition:transform .5s var(--ease)}
.profile .glare{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(260px circle at var(--mx,-300px) var(--my,-300px),rgba(255,255,255,.28),transparent 60%);mix-blend-mode:soft-light}
.icon-btn,.chip-btn,.cta,.round,.arrow,.navpill,.logo,.doc{transition:transform .2s var(--ease),translate .35s var(--ease),background .25s}
.blob{position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.55}
.blob.a{width:42vw;height:42vw;right:-8vw;bottom:-10vw;background:var(--glow);animation:drift1 22s ease-in-out infinite alternate}
.blob.b{width:30vw;height:30vw;left:-6vw;top:20vh;background:color-mix(in srgb,var(--glow) 40%,var(--ground));animation:drift2 28s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-14vw,-10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(10vw,-12vh) scale(.9)}}
.pbar{position:relative;overflow:hidden}
.pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:shine 5.5s ease-in-out infinite;animation-delay:calc(var(--i,0)*.35s + 1.6s);pointer-events:none}
.pbar.dark::after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%)}
@keyframes shine{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
.shock{position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid var(--yellow);pointer-events:none;z-index:150;animation:shock .6s var(--ease) forwards}
@keyframes shock{to{transform:scale(6);opacity:0;border-width:.5px}}
.cur{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent);pointer-events:none;z-index:300;opacity:0;transition:opacity .3s,width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease),background .3s,border-color .3s}
.cur.vis{opacity:1}
.cur.hot{width:44px;height:44px;margin:-22px 0 0 -22px;background:color-mix(in srgb,var(--yellow) 22%,transparent);border-color:var(--yellow)}
.cur.down{width:18px;height:18px;margin:-9px 0 0 -9px}
@media (pointer:coarse){.cur{display:none}}
body.calm .cur,body.calm .blob{display:none}
.dg{display:inline-grid;overflow:hidden;height:1.05em;vertical-align:top}
.dg > span{grid-area:1/1}
.dg .in{animation:dgIn .45s var(--ease) both}
.dg .out{animation:dgOut .45s var(--ease) both}
@keyframes dgIn{from{transform:translateY(100%);filter:blur(2px)}}
@keyframes dgOut{to{transform:translateY(-100%);filter:blur(2px);opacity:0}}
.dial.running #arc{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 6px var(--yellow))}}
.dial.running::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;left:50%;top:50%;margin:-75px 0 0 -75px;border:1.5px solid var(--yellow);opacity:0;animation:ping 2s ease-out infinite;pointer-events:none}
@keyframes ping{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.3);opacity:0}}
.now::before{animation:pulseDot 1.8s ease-in-out infinite}
@keyframes pulseDot{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--yellow) 30%,transparent)}}
.icon-btn.ring svg{animation:ringBell .9s var(--ease)}
@keyframes ringBell{10%,30%,50%{transform:rotate(16deg)}20%,40%{transform:rotate(-14deg)}60%{transform:rotate(6deg)}100%{transform:none}}
.badge.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.6)}}
.notif.new{animation:notifIn .6s var(--ease) both;background:color-mix(in srgb,var(--yellow) 12%,transparent)}
@keyframes notifIn{from{opacity:0;transform:translateY(-10px);max-height:0}to{max-height:80px}}
.logo i{transition:transform .8s var(--ease)}
.logo:hover i{transform:rotate(180deg)}
tr.row:hover .nm svg{animation:wiggle .5s var(--ease)}
@keyframes wiggle{30%{transform:rotate(-10deg) scale(1.12)}60%{transform:rotate(6deg) scale(1.08)}}
.tm:hover svg{transform:scale(1.08);transition:transform .3s var(--ease)}
.task.done .ic{animation:spinIn .5s var(--ease)}
@keyframes spinIn{from{transform:rotate(-120deg) scale(.6)}}
.onb .pct.up{animation:pctUp .6s var(--ease)}
@keyframes pctUp{40%{transform:translateY(-4px) scale(1.08);color:var(--yellow)}}
#view{--dir:1}
#view.leaving > *{transform:translateX(calc(var(--dir) * -24px))}
.eq{display:flex;align-items:flex-end;gap:2px;height:13px}
.eq i{width:2.5px;border-radius:2px;background:currentColor;height:30%;transition:height .3s}
.snd.on .eq i{animation:eq 1s ease-in-out infinite}
.snd.on .eq i:nth-child(2){animation-delay:-.4s}.snd.on .eq i:nth-child(3){animation-delay:-.7s}.snd.on .eq i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.kbd{font:500 10px var(--body);padding:2px 5px;border-radius:5px;background:var(--card-2);color:var(--ink-2)}
/* Command palette */
.cmdk{position:fixed;inset:0;z-index:250;display:grid;place-items:start center;padding:12vh 16px 0;background:color-mix(in srgb,var(--ground) 45%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.cmdk.open{opacity:1;pointer-events:auto}
.cmdk .box{width:min(560px,100%);border-radius:22px;background:var(--panel);color:var(--on-panel);box-shadow:0 40px 80px -20px rgba(0,0,0,.5);overflow:hidden;transform:translateY(-12px) scale(.97);transition:transform .4s var(--ease)}
.cmdk.open .box{transform:none}
.cmdk .in{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.cmdk input{flex:1;background:none;border:0;outline:none;font-size:15px;color:var(--on-panel)}
.cmdk input::placeholder{color:var(--on-panel-2)}
.cmdk ul{list-style:none;margin:0;padding:8px;max-height:min(52vh,380px);overflow:auto}
.cmdk li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:13px;transition:background .15s}
.cmdk li .g{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);overflow:hidden;flex:none}
.cmdk li .g svg{width:100%;height:100%}
.cmdk li .g svg[width]{width:14px;height:14px}
.cmdk li small{margin-left:auto;color:var(--on-panel-2);font-size:11px}
.cmdk li.act{background:var(--panel-2)}
.cmdk li.act .g{background:var(--yellow);color:var(--yellow-ink)}
.cmdk .ft{display:flex;gap:14px;padding:10px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:var(--on-panel-2)}
.cmdk .ft b{font-weight:500;color:var(--on-panel);background:var(--panel-2);padding:1px 5px;border-radius:4px;margin-right:3px}
.cmdk .none{padding:22px;text-align:center;color:var(--on-panel-2);font-size:12px}
@media (max-width:620px){ .snd,#cmdBtn{display:none} }

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .bento{grid-template-columns:1fr 1fr 1fr;grid-template-rows:268px 250px auto}
  .onb{grid-area:auto;grid-column:1/-1;min-height:430px}
  .pay{grid-template-columns:220px minmax(0,1fr)}
  .side{grid-column:1/-1}
}
@media (max-width:900px){
  .stats{flex-direction:column;align-items:stretch;gap:16px}
  .bento{grid-template-columns:1fr 1fr;grid-template-rows:none;grid-auto-rows:auto}
  .profile{grid-area:auto;min-height:268px}
  .progress,.timer{grid-area:auto;min-height:268px}
  .acc{grid-area:auto}
  .cal{grid-area:auto;grid-column:1/-1;min-height:260px}
  .pay{grid-template-columns:1fr}
  .team ul{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .tm{width:auto;flex:none}
}
@media (max-width:620px){
  body{padding-block:16px 32px}
  .app{padding:16px;border-radius:24px}
  .seg button{padding:0 11px}
  .chip-btn .lbl{display:none}
  .chip-btn{width:38px;padding:0;justify-content:center}
  .bento{grid-template-columns:1fr}
  .kpis{justify-content:space-between}

<script>
/* ================= Sound engine (Web Audio, synthesized — no files) ================= */
const SFX = (()=>{
  let ctx=null, master=null, nbuf=null;
  let on = true; try{ on = localStorage.getItem('coterie-sound')!=='off' }catch(e){}
  function ac(){
    if(!ctx){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      ctx=new C(); master=ctx.createGain(); master.gain.value=.55;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=4;
      master.connect(comp); comp.connect(ctx.destination);
      nbuf=ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function tone(f,d,{type='sine',v=.14,a=.004,to=null,at=0,pan=0}={}){
    if(!on) return; const c=ac(); if(!c) return;
    const t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    let out=g; if(c.createStereoPanner && pan){ const p=c.createStereoPanner(); p.pan.value=pan; g.connect(p); out=p; }
    o.connect(g); out.connect(master); o.start(t); o.stop(t+d+.03);
  }
  function noise(d,{v=.08,f1=500,f2=2500,q=1.1,type='bandpass',at=0}={}){
    if(!on) return; const c=ac(); if(!c) return;
    const t=c.currentTime+at, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=nbuf; f.type=type; f.Q.value=q;
    f.frequency.setValueAtTime(f1,t); f.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+d*.35); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+d+.02);
  }
  const chord=(fs,step,d,o={})=>fs.forEach((f,i)=>tone(f,d,{...o,at:(o.at||0)+i*step}));
  return {
    get on(){return on},
    set on(x){ on=x; try{ localStorage.setItem('coterie-sound', x?'on':'off') }catch(e){} if(x){ ac(); this.enable(); } },
    unlock(){ if(on) ac(); },
    tick(){ tone(2200,.03,{v:.05}) },
    tap(){ tone(620,.07,{type:'triangle',v:.1,to:420}) },
    whoosh(dir=1){ noise(.38,{v:.09,f1:dir>0?350:2600,f2:dir>0?2600:350,q:.8}); },
    check(){ chord([784,1175],.07,.16,{type:'triangle',v:.12}); tone(2350,.25,{v:.025,at:.12}) },
    uncheck(){ tone(560,.1,{type:'triangle',v:.09,to:360}) },
    start(){ chord([523,784],.08,.14,{type:'triangle',v:.12}) },
    stop(){ chord([784,523],.08,.16,{type:'triangle',v:.11}) },
    sec(){ tone(3100,.012,{type:'square',v:.012}); tone(180,.03,{v:.03}) },
    rewind(){ tone(1400,.32,{type:'triangle',v:.07,to:180}); noise(.3,{v:.04,f1:3000,f2:300}) },
    bell(){ [1318.5,1760,2637].forEach((f,i)=>tone(f,1.1-i*.2,{v:.09-i*.02,a:.002,at:i*.012})); tone(1318.5,.9,{v:.05,at:.18}) },
    blip(){ tone(988,.08,{v:.06}) },
    swish(open){ noise(.2,{v:.05,f1:open?900:3200,f2:open?3200:900,type:'highpass',q:.6}) },
    slide(dir){ noise(.24,{v:.06,f1:dir>0?600:1800,f2:dir>0?1800:600}); tone(dir>0?1500:1100,.04,{v:.04,at:.05}) },
    lift(){ tone(300,.09,{v:.1,to:520,type:'triangle'}) },
    drop(){ tone(240,.12,{v:.16,to:120}); noise(.06,{v:.05,f1:1200,f2:400,type:'lowpass'}) },
    key(){ tone(1300+Math.random()*700,.018,{type:'square',v:.015}) },
    select(on){ tone(on?740:520,.06,{type:'triangle',v:.08,to:on?900:420}) },
    sparkle(){ chord([1047,1319,1568,2093,2637],.045,.3,{v:.06}) },
    success(){ chord([523,659,784,1047],.09,.5,{type:'triangle',v:.11}); chord([1568,2093,2637,3136],.06,.6,{v:.03,at:.36}) },
    swap(){ tone(480,.07,{type:'triangle',v:.08}); tone(720,.09,{type:'triangle',v:.08,at:.05}) },
    open(){ tone(520,.08,{v:.08,to:820}) },
    close(){ tone(760,.08,{v:.06,to:480}) },
    note(level){ const scale=[523,587,659,784,880,1047,1175,1319]; const f=scale[Math.max(0,Math.min(7,Math.round(level*7)))]; tone(f,.35,{v:.05,a:.003}); tone(f*2,.2,{v:.012}) },
    error(){ tone(220,.12,{type:'square',v:.04}); tone(196,.16,{type:'square',v:.04,at:.1}) },
    pop(){ tone(900,.05,{v:.07,to:1300}) },
  };
})();

/* ================= Motion helpers ================= */
const FX = (()=>{
  const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches || document.body.classList.contains('calm');
  const fine=()=>matchMedia('(pointer:fine)').matches;

  /* Confetti */
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  const cx=cv.getContext('2d'); let parts=[], raf=0;
  function size(){ const r=devicePixelRatio||1; cv.width=innerWidth*r; cv.height=innerHeight*r; cx.setTransform(r,0,0,r,0,0); }
  size(); addEventListener('resize',size);
  function burst(x,y,n=90,spread=1){
    if(calm()) return;
    const css=getComputedStyle(document.documentElement);
    const cols=['#F2C23D','#F7E7B0',css.getPropertyValue('--solid').trim()||'#1F1E1C','#E0A92A','#FFFFFF'];
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1*spread, s=5+Math.random()*9;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,
        w:5+Math.random()*6,h:3+Math.random()*5,c:cols[i%cols.length],life:0,max:70+Math.random()*50,shape:Math.random()<.3?'c':'r'});
    }
    if(!raf) loop();
  }
  function loop(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life<p.max);
    for(const p of parts){
      p.life++; p.vy+=.28; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      cx.save(); cx.globalAlpha=Math.max(0,1-p.life/p.max); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
      if(p.shape==='c'){ cx.beginPath(); cx.arc(0,0,p.w/2.4,0,7); cx.fill(); } else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life*.15+p.r)));
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,innerWidth,innerHeight),0);
  }
  const burstFrom=(el,n,spread)=>{ if(!el) return; const r=el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, n, spread); };

  /* Click shockwave */
  document.addEventListener('pointerdown',e=>{
    SFX.unlock();
    if(calm()) return;
    if(!e.target.closest('button,.task,tr.row,.dc,.day,.ev,.tm,label.search')) return;
    const s=document.createElement('span'); s.className='shock'; s.style.left=e.clientX+'px'; s.style.top=e.clientY+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),650);
  },true);

  /* Magnetic buttons */
  const MAG='.icon-btn,.chip-btn,.cta,.round,.arrow,.navpill,.logo,.doc';
  let magEl=null;
  document.addEventListener('pointermove',e=>{
    if(!fine()||calm()) return;
    const el=e.target.closest(MAG);
    if(magEl && magEl!==el){ magEl.style.translate=''; magEl=null; }
    if(el){ magEl=el; const r=el.getBoundingClientRect(); const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
      el.style.translate=`${dx*.22}px ${dy*.28}px`; }
  });

  /* Card spotlight + 3D tilt */
  document.addEventListener('pointermove',e=>{
    const card=e.target.closest('.card,.tbl-wrap'); 
    $$('.card.tilt,.tbl-wrap.tilt').forEach(c=>{ if(c!==card){ c.classList.remove('tilt'); c.style.transform=''; } });
    if(!card||!fine()) return;
    const r=card.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    card.style.setProperty('--mx',x+'px'); card.style.setProperty('--my',y+'px');
    if(calm() || card.matches('.tbl-wrap') || card.querySelector('.ev.drag')) return;
    const max=Math.max(1.2,Math.min(6,1500/r.width));
    const rx=((y/r.height)-.5)*-max, ry=((x/r.width)-.5)*max;
    card.classList.add('tilt'); card.style.transform=`perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(0)`;
    if(card.classList.contains('profile')){ card.style.setProperty('--px',(x/r.width-.5)*-14+'px'); card.style.setProperty('--py',(y/r.height-.5)*-10+'px'); }
  });
  document.addEventListener('pointerleave',()=>$$('.card.tilt').forEach(c=>{c.classList.remove('tilt');c.style.transform=''}));
  // Entrance animations hand control back to inline transforms once finished
  document.addEventListener('animationend',e=>{ if(e.animationName==='rise') e.target.classList.remove('rise'); });

  /* Musical progress bars */
  let lastDay=null;
  document.addEventListener('pointerover',e=>{
    const d=e.target.closest('.day'); if(d===lastDay) return; lastDay=d;
    if(d){ const i=[...d.parentNode.children].indexOf(d); SFX.note((WEEK[i]?WEEK[i][1]:0)/8); }
  });

  /* Soft cursor follower */
  const cur=document.createElement('div'); cur.className='cur'; document.body.appendChild(cur);
  let tx=-100,ty=-100,cx2=-100,cy2=-100;
  document.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse') return; tx=e.clientX; ty=e.clientY;
    cur.classList.toggle('hot',!!e.target.closest('button,a,input,.task,tr.row,.dc,.day,.ev,.tm,[tabindex]')); cur.classList.add('vis'); });
  document.addEventListener('pointerdown',()=>cur.classList.add('down')); document.addEventListener('pointerup',()=>cur.classList.remove('down'));
  document.addEventListener('mouseleave',()=>cur.classList.remove('vis'));
  (function follow(){ cx2+=(tx-cx2)*.2; cy2+=(ty-cy2)*.2; cur.style.transform=`translate(${cx2}px,${cy2}px)`; requestAnimationFrame(follow); })();

  /* Rolling digits */
  function roll(el,str){
    if(el.dataset.v===str) return;
    const old=el.dataset.v||'';
    if(!el.querySelector('.dg') || old.length!==str.length){ el.innerHTML=[...str].map(ch=>`<span class="dg"><span>${ch}</span></span>`).join(''); el.dataset.v=str; return; }
    [...str].forEach((ch,i)=>{ if(old[i]!==ch){ const box=el.children[i]; const o=box.firstElementChild; const n=document.createElement('span'); n.textContent=ch;
      if(!calm()){ n.className='in'; o.className='out'; setTimeout(()=>o.remove(),450); } else o.remove(); box.appendChild(n); } });
    el.dataset.v=str;
  }

  /* Greeting by local time */
  const greet=()=>{ const h=new Date().getHours(); return h<12?'Good morning, Amara':h<18?'Good afternoon, Amara':'Good evening, Amara'; };

  return {burst,burstFrom,roll,greet,calm};
})();
</script>

/* ================= Illustrated avatars ================= */
function avatar(p){
  const {skin,hair,bg,style,beard,shirt='#F5F2EA'} = p.look;
  let back='', front='';
  if(style==='curly'){
    let c=''; for(let i=0;i<16;i++){const a=Math.PI*(0.95+i/15*1.1); c+=`<circle cx="${20+Math.cos(a)*10.5}" cy="${16+Math.sin(a)*9.5}" r="4.4" fill="${hair}"/>`;}
    back=`<ellipse cx="20" cy="17" rx="11.5" ry="10.5" fill="${hair}"/>${c}`;
  } else if(style==='long'){

const $ = (s,r=document)=>r.querySelector(s);

const fmt = n => n.toLocaleString('en-US');
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches || document.body.classList.contains('calm');
function countUp(el, to, {dur=1400, dec=0, pre='', from=0}={}){
  if(reduced()){ el.textContent = pre + (dec? to.toFixed(dec) : fmt(Math.round(to))); return; }
  const t0=performance.now();
  const step=t=>{
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4), v=from+(to-from)*e;
    el.textContent = pre + (dec? v.toFixed(dec) : fmt(Math.round(v)));
    if(k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
let toastT;
function toast(msg){
  const t=$('#toast'); t.querySelector('span').textContent=msg; t.classList.add('show'); SFX.blip();
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
function splitTitle(text){
  let c=0;
  return text.split(' ').map(w=>`<span class="w">${[...w].map(ch=>`<span class="c" style="--c:${c++}">${ch}</span>`).join('')}</span>`).join(' ');
}

function drawTimer(first){
  const t=S.timer, h=Math.floor(t.sec/3600), m=Math.floor(t.sec%3600/60), sc=t.sec%60;
  const clock=$('#clock'); if(!clock) return;
  FX.roll(clock,`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`); FX.roll($('#tsec'),String(sc)); $('.dial').classList.toggle('running',t.run);
  const st=$('#tstate'); st.textContent=t.run?'Tracking':'Paused'; st.classList.toggle('on',t.run);
  const goal=7*3600, frac=Math.min(1,t.sec/goal), C=402.1;
  const arc=$('#arc');
  if(first && !reduced()){ arc.style.strokeDashoffset=C; requestAnimationFrame(()=>requestAnimationFrame(()=>{arc.style.transition='stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)';arc.style.strokeDashoffset=C*(1-frac); setTimeout(()=>arc.style.transition='',1700)})); }
  else arc.style.strokeDashoffset=C*(1-frac);
  // knob = seconds hand; keep rotating forward without unwinding at 60
  const knob=$('#knob'); const prev=+(knob.dataset.a||0); let a=sc*6;
  while(a < prev-180) a+=360;
  if(sc===0 && prev%360!==0) a=Math.ceil(prev/360)*360;
  knob.dataset.a=a; knob.style.transform=`rotate(${a}deg)`;
  $$('#ticks .tick').forEach(l=>l.classList.toggle('on', +l.dataset.k<=sc && (t.run || +l.dataset.k>=sc-2)));
  const pb=$('#tPlay'); pb.innerHTML=ic(t.run?'pause':'play',13); pb.setAttribute('aria-label',t.run?'Pause timer':'Start timer');
}
let tickT=null;
function startTick(){ stopTick(); tickT=setInterval(()=>{ S.timer.sec++; drawTimer(); if(!document.hidden) SFX.sec(); },1000); }
function stopTick(){ if(tickT){clearInterval(tickT); tickT=null;} }

function drawOnboarding(first){

  $('#onbCnt').textContent=`${done}/${TASKS.length}`;
  const g=$('#groups');

  }

    $$('.task',ul).forEach(li=>{
      const flip=()=>{ const t=TASKS[li.dataset.i]; t.done=!t.done; li.classList.toggle('done',t.done); li.setAttribute('aria-checked',t.done); drawOnboarding(false);
        t.done?SFX.check():SFX.uncheck(); if(t.done) FX.burstFrom(li.querySelector('.ck'),14,.5);
        const pe=$('#onbPct'); pe.classList.remove('up'); void pe.offsetWidth; pe.classList.add('up');
        const d=TASKS.filter(x=>x.done).length; if(d===TASKS.length){ setTimeout(()=>{ SFX.success(); FX.burstFrom($('.onb'),160,1.4); },180); toast('Onboarding complete for Jonah'); } };
      li.addEventListener('click',flip);
      li.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();} });
    });
  }
}

function weekStart(i){ const [y,m,d]=WEEK_KEYS[i].split('-').map(Number); return new Date(y,m-1,d); }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat'];
function addDays(dt,n){ const x=new Date(dt); x.setDate(x.getDate()+n); return x; }
function drawWeek(dir){
  const st=weekStart(S.weekIdx), end=addDays(st,5);
  const lbl = st.getMonth()===end.getMonth() ? `${MON[st.getMonth()]} ${st.getDate()} – ${end.getDate()}` : `${MON[st.getMonth()]} ${st.getDate()} – ${MON[end.getMonth()]} ${end.getDate()}`;
  $('#wTitle').textContent=lbl;
  const prev=addDays(st,-7), next=addDays(st,7);
  $('#wPrev span').textContent=`${MON[prev.getMonth()]} ${prev.getDate()}`;
  $('#wNext span').textContent=`${MON[next.getMonth()]} ${next.getDate()}`;
  $('#wPrev').style.opacity=S.weekIdx>0?1:.4; $('#wNext').style.opacity=S.weekIdx<WEEK_KEYS.length-1?1:.4;
  const days=$('#wDays');
  days.innerHTML='<div></div>'+DOW.map((n,i)=>{const d=addDays(st,i); const today=d.toDateString()===TODAY.toDateString();
    return `<div class="${today?'today':''}">${n}<b>${d.getDate()}</b></div>`}).join('');
  const body=$('#wBody');
  const G=52, HOURS=[8,9,10,11];
  body.style.setProperty('--g', getComputedStyle(body).gridTemplateColumns.split(' ')[0]);
  body.innerHTML = HOURS.map(h=>`<div class="hr"><span>${h}:00 am</span></div>`).join('')
    + [0,1,2,3,4,5].map(i=>`<div class="vl" style="left:calc(var(--g) + (100% - var(--g)) * ${i/6})"></div>`).join('')
    + (S.weekIdx===1 ? `<div class="now" style="top:${(NOW_H-8)*40}px;left:var(--g)"></div>` : '')
    + WEEKS[WEEK_KEYS[S.weekIdx]].map((e,i)=>evHTML(e,i)).join('');
  [days,body].forEach(el=>{ el.classList.remove('wk-anim'); void el.offsetWidth; if(dir){el.style.setProperty('--dx',(dir*14)+'px'); el.classList.add('wk-anim');} });
  $$('.ev',body).forEach(el=>dragEvent(el,body));
}
function evHTML(e,i){
  return `<div class="ev ${e.kind}" data-i="${i}" style="--i:${i};left:calc(var(--g) + (100% - var(--g)) * ${e.d/6} + 3px);width:calc((100% - var(--g)) * ${e.span/6} - 6px);top:${(e.h-8)*40+2}px;height:${e.len*40+4}px">
    <div class="t"><b>${e.title}</b><small>${e.sub}</small></div>
    <div class="faces">${e.faces.map(f=>avatar(byId(f))).join('')}</div></div>`;
}
// Drag events across the week grid (snaps to quarter-hour and half-day)
function dragEvent(el, body){
  let sx,sy,ox,oy,moved=false;
  el.addEventListener('pointerdown',e=>{
    sx=e.clientX; sy=e.clientY; moved=false; el.setPointerCapture(e.pointerId);
    const ev=WEEKS[WEEK_KEYS[S.weekIdx]][el.dataset.i]; ox=ev.d; oy=ev.h;
    const mv=m=>{
      const dx=m.clientX-sx, dy=m.clientY-sy;
      if(!moved && Math.hypot(dx,dy)<4) return;
      moved=true; el.classList.add('drag'); SFX.lift();
      const colW=(body.clientWidth-parseFloat(getComputedStyle(body).getPropertyValue('--g')))/6;
      ev.d=Math.max(0,Math.min(6-ev.span,Math.round((ox+dx/colW)*2)/2));
      ev.h=Math.max(8,Math.min(11.2-ev.len+.2,Math.round((oy+dy/40)*4)/4));
      el.style.left=`calc(var(--g) + (100% - var(--g)) * ${ev.d/6} + 3px)`;
      el.style.top=`${(ev.h-8)*40+2}px`;
    };
    const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.classList.remove('drag');
      if(moved){ SFX.drop(); const hh=Math.floor(ev.h), mm=Math.round((ev.h-hh)*60); toast(`${ev.title} moved to ${DOW[Math.floor(ev.d)]} ${hh}:${String(mm).padStart(2,'0')}`); }
      else toast(`${ev.title} · ${ev.sub}`); };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
  });
}

function monthData(id){
  const d=PAY[id]; let seed=d.seed*9301+49297; const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);
  const out={};
  for(let day=1; day<=30; day++){
    const dt=new Date(2026,8,day), wd=dt.getDay();
    if(wd===0||wd===6) continue;
    if(dt>TODAY) continue;
    const r=rnd();
    if(day===1 || r<d.leave/100*.9) out[day]={leave:true};
    else if(r>.93) out[day]={h:10.5};
    else out[day]={h:[7,7.5,7.5,8,7.5,7][Math.floor(rnd()*6)]};
  }
  return out;
}

function closePops(except){ Object.values(pops).forEach(id=>{ if(id!==except) $('#'+id).classList.remove('open'); }); }
Object.entries(pops).forEach(([b,p])=>{
  $('#'+b).addEventListener('click',e=>{ e.stopPropagation(); const el=$('#'+p); const open=!el.classList.contains('open'); closePops(p); el.classList.toggle('open',open); if(p==='bellPop'&&open){ SFX.bell(); S.unread=0; } else open?SFX.open():SFX.close();
    if(p==='bellPop' && open) $('#badge').classList.add('gone'); });
  $('#'+p).addEventListener('click',e=>e.stopPropagation());
  $('#'+p+' [data-close]').addEventListener('click',()=>{ SFX.close(); $('#'+p).classList.remove('open'); });
});
document.addEventListener('click',()=>closePops());
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePops(); });
$('#notifs').innerHTML=NOTIFS.map(n=>{const p=byId(n.p); return `<div class="notif"><span style="width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none">${avatar(p)}</span><div><b>${p.name}</b><span>${n.a}</span><small>${n.t}</small></div></div>`}).join('');

// Theme + motion settings
function applyTheme(t){
  if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
  $$('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  store('coterie-theme', t==='auto'?undefined:t);
}
$$('#themeSeg button').forEach(b=>b.addEventListener('click',()=>{ SFX.tap(); applyTheme(b.dataset.t); }));
applyTheme(load('coterie-theme')||'auto');
$('#calmSw').addEventListener('click',e=>{ SFX.tap(); const on=!document.body.classList.contains('calm'); document.body.classList.toggle('calm',on); e.currentTarget.classList.toggle('on',on); e.currentTarget.setAttribute('aria-checked',on); });
$('#replay').addEventListener('click',()=>{ closePops(); go(S.page,true); });

/* ================= Boot ================= */
hydrateIcons();
const h=(location.hash||'').slice(1);
if(['overview','people','payroll'].includes(h)){ S.page=h; $$('#nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.page===h)); }
render();
const ind=$('#ind'); ind.style.transition='none'; moveInd(); requestAnimationFrame(()=>ind.style.transition='');
addEventListener('resize',()=>{ moveInd(); if(S.page==='overview' && $('#wBody')) $('#wBody').style.setProperty('--g', getComputedStyle($('#wBody')).gridTemplateColumns.split(' ')[0]); });
document.fonts && document.fonts.ready.then(moveInd);

/* ================= Sound toggle ================= */
function setSound(on){
  SFX.on=on; $('#sndBtn').classList.toggle('on',on); $('#sndBtn').setAttribute('aria-pressed',on);
  $('#sndSw').classList.toggle('on',on); $('#sndSw').setAttribute('aria-checked',on);
  if(on) SFX.sparkle();
}
$('#sndBtn').classList.toggle('on',SFX.on); $('#sndSw').classList.toggle('on',SFX.on);
$('#sndBtn').addEventListener('click',()=>{ setSound(!SFX.on); toast(SFX.on?'Sound effects on':'Sound effects off'); });
$('#sndSw').addEventListener('click',()=>setSound(!SFX.on));
$('.logo').addEventListener('click',e=>{ SFX.sparkle(); FX.burstFrom(e.currentTarget,40,1); });

/* ================= Live notifications ================= */
const INCOMING=[
  {p:'kai', a:'shared the Q3 headcount report'},
  {p:'sofia', a:'uploaded new brand assets'},
  {p:'omar', a:'requested a laptop upgrade'},
  {p:'ines', a:'scheduled 3 interviews for Friday'},
];
let incoming=0;
function pushNotif(){
  if(incoming>=INCOMING.length) return;
  const n=INCOMING[incoming++], p=byId(n.p), box=$('#notifs');
  const div=document.createElement('div'); div.className='notif new';
  div.innerHTML=`<span style="width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none">${avatar(p)}</span><div><b>${p.name}</b><span>${n.a}</span><small>just now</small></div>`;
  box.prepend(div);
  const bell=$('#bellBtn'), badge=$('#badge');
  if(!$('#bellPop').classList.contains('open')){ S.unread=(S.unread||0)+1; }
  badge.textContent=S.unread||1; badge.classList.toggle('gone',!S.unread);
  badge.classList.remove('bump'); bell.classList.remove('ring'); void bell.offsetWidth; badge.classList.add('bump'); bell.classList.add('ring');
  SFX.bell(); toast(`${p.name.split(' ')[0]} ${n.a}`);
  setTimeout(pushNotif, 45000+Math.random()*20000);
}
setTimeout(pushNotif, 14000);

/* ================= Command palette ================= */
const cmdk=$('#cmdk'), cmdIn=$('#cmdIn'), cmdList=$('#cmdList');
let cmdItems=[], cmdAct=0;
function commands(){
  const g=n=>ic(n,14);
  const base=[
    {t:'Go to Overview', k:'1', i:g('arrow'), run:()=>go('overview')},
    {t:'Go to People', k:'2', i:g('team'), run:()=>go('people')},
    {t:'Go to Payroll', k:'3', i:g('file'), run:()=>go('payroll')},
    {t:S.timer.run?'Pause time tracker':'Start time tracker', k:'Space', i:g(S.timer.run?'pause':'play'), run:toggleTimer},
    {t:'Add member', k:'', i:g('plus'), run:()=>{ go('people'); setTimeout(()=>$('#add')&&$('#add').click(), 500); }},
    {t:SFX.on?'Mute sound effects':'Turn on sound effects', k:'M', i:g('bell'), run:()=>setSound(!SFX.on)},
    {t:'Switch to dark theme', k:'', i:g('sun'), run:()=>applyTheme('dark')},
    {t:'Switch to light theme', k:'', i:g('sun'), run:()=>applyTheme('light')},
    {t:'Celebrate', k:'', i:g('zap'), run:()=>{ SFX.success(); FX.burst(innerWidth/2, innerHeight*.6, 200, 1.6); }},
  ];
  const ppl=PEOPLE.map(p=>({t:p.name, sub:PAY[p.id]?'Open payroll':'Find in People', i:avatar(p),
    run:()=>{ if(PAY[p.id]){ S.pay.who=p.id; S.page==='payroll'?go('payroll',true):go('payroll'); } else { S.people.q=p.name; go('people',S.page==='people'); } }}));
  return base.concat(ppl);
}
function drawCmd(){
  const q=cmdIn.value.trim().toLowerCase();
  cmdItems=commands().filter(c=>!q || (c.t+' '+(c.sub||'')).toLowerCase().includes(q));
  cmdAct=Math.min(cmdAct,Math.max(0,cmdItems.length-1));
  cmdList.innerHTML = cmdItems.length ? cmdItems.map((c,i)=>`<li class="${i===cmdAct?'act':''}" data-i="${i}"><span class="g">${c.i}</span>${c.t}<small>${c.sub||(c.k?`<span class="kbd" style="background:var(--panel-2);color:var(--on-panel-2)">${c.k}</span>`:'')}</small></li>`).join('')
    : `<li class="none">Nothing matches “${cmdIn.value}”.</li>`;
}
function openCmd(){ closePops(); cmdIn.value=''; cmdAct=0; drawCmd(); cmdk.classList.add('open'); cmdIn.focus(); SFX.open(); }
function closeCmd(){ if(!cmdk.classList.contains('open')) return; cmdk.classList.remove('open'); cmdIn.blur(); SFX.close(); }
function runCmd(i){ const c=cmdItems[i]; if(!c) return; closeCmd(); setTimeout(c.run,120); }
cmdIn.addEventListener('input',()=>{ SFX.key(); cmdAct=0; drawCmd(); });
cmdIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!cmdItems.length) return; cmdAct=(cmdAct+(e.key==='ArrowDown'?1:-1)+cmdItems.length)%cmdItems.length; SFX.tick(); drawCmd(); cmdList.children[cmdAct]?.scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'){ e.preventDefault(); runCmd(cmdAct); }
  else if(e.key==='Escape'){ e.preventDefault(); closeCmd(); }
});
cmdList.addEventListener('pointermove',e=>{ const li=e.target.closest('li[data-i]'); if(li && +li.dataset.i!==cmdAct){ cmdAct=+li.dataset.i; $$('li',cmdList).forEach((x,i)=>x.classList.toggle('act',i===cmdAct)); SFX.tick(); } });
cmdList.addEventListener('click',e=>{ const li=e.target.closest('li[data-i]'); if(li) runCmd(+li.dataset.i); });
cmdk.addEventListener('click',e=>{ if(e.target===cmdk) closeCmd(); });
$('#cmdBtn').addEventListener('click',e=>{ e.stopPropagation(); openCmd(); });

/* ================= Keyboard shortcuts ================= */
function toggleTimer(){
  if(S.page!=='overview'){ S.timer.run=!S.timer.run; S.timer.run?SFX.start():SFX.stop(); toast(S.timer.run?'Time tracker running':'Time tracker paused'); return; }
  $('#tPlay').click();
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); cmdk.classList.contains('open')?closeCmd():openCmd(); return; }
  if(e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey || cmdk.classList.contains('open')) return;
  if(e.key==='1') go('overview'); else if(e.key==='2') go('people'); else if(e.key==='3') go('payroll');
  else if(e.key==='?'){ e.preventDefault(); openCmd(); }
  else if(e.key.toLowerCase()==='m'){ setSound(!SFX.on); toast(SFX.on?'Sound effects on':'Sound effects off'); }
  else if(e.key==='/' && S.page==='people'){ e.preventDefault(); $('#q').focus(); }
  else if(e.key===' ' && !e.target.closest('button,[tabindex],li')){ e.preventDefault(); toggleTimer(); }
});
hydrateIcons();
</script>
</body>
</html>
